<header class="site-header">
  <div class="wrapper site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="Primary">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </label>

      <div class="nav-links">
        <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav-link" href="{{ '/resume/' | relative_url }}">Resume</a>
        <a class="nav-link" href="{{ '/projects/' | relative_url }}">Projects</a>
      </div>

      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-icon theme-icon--sun">{% include icon.html name="sun" class="contact-icon" %}</span>
        <span class="theme-icon theme-icon--moon">{% include icon.html name="moon" class="contact-icon" %}</span>
      </button>
    </nav>
  </div>
</header>
<script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
