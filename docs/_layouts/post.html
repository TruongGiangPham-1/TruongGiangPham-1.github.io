---
layout: base
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {%- if page.date -%}
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%b %-d, %Y" }}
        </time>
      </p>
    {%- endif -%}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
